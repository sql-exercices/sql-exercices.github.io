<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site déplacé</title>
  <link rel="canonical" href="https://mpi-informatique.github.io/sql/">
  <script>
    const base = "/";
    const path = location.pathname;
    const suffix = path.startsWith(base) ? path.slice(base.length) : '';
    document.querySelector('link[rel="canonical"]').href = "https://mpi-informatique.github.io/sql/" + suffix;
    location.replace("https://mpi-informatique.github.io/sql/" + suffix + location.search + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://mpi-informatique.github.io/sql/"></noscript>
</head>
<body>
  <p>Le site a déménagé : <a href="https://mpi-informatique.github.io/sql/">accéder à la nouvelle adresse</a>.</p>
</body>
</html>
